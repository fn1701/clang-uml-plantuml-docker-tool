name: Build and push image

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "Dockerfile"
      - "entrypoint.sh"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch:
  workflow_call:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/clang-uml-plantuml-docker-tool
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          REF_TAG=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          echo "tags=${IMAGE}:${REF_TAG},${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
